<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor-principal">

        <!-- REGISTRO -->
        <div class="formulario" id="registro">

            <h2>Crear cuenta</h2>

            <form id="formulario-registro">

                <input
                    type="text"
                    id="reg-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="reg-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Registrarse
                </button>

            </form>

            <p class="cambiar-formulario">
                ¿Ya tienes una cuenta?
                <button type="button" id="mostrar-login">
                    Iniciar sesión
                </button>
            </p>

        </div>


        <!-- LOGIN -->
        <div class="formulario oculto" id="login">

            <h2>Iniciar sesión</h2>

            <form id="formulario-login">

                <input
                    type="text"
                    id="log-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="log-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="cambiar-formulario">
                ¿No tienes una cuenta?
                <button type="button" id="mostrar-registro">
                    Registrarse
                </button>
            </p>

        </div>


        <!-- MENSAJE -->
        <p id="mensaje"></p>


        <!-- RECURSO PROTEGIDO -->
        <div class="seccion-protegida">

            <h3>Recurso protegido</h3>

            <button id="acceso-protegido">
                Acceder a datos protegidos
            </button>

            <button id="cerrar-sesion">
                Cerrar sesión
            </button>

            <p id="mensaje-protegido"></p>

        </div>

    </main>

    <script src="app.js"></script>

</body>

</html>
